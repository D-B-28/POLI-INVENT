<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>POLI INVENT — inquadra l'immagine</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:system-ui, sans-serif; }
  html { background:#000; }
  body { background:transparent; }

  #brand {
    position:fixed; top:0; left:0; right:0; z-index:10; pointer-events:none;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    font-weight:700; letter-spacing:.14em; font-size:.9rem; color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  #brand span { color:#ffd7a8; }

  /* pannello descrizione (compare quando trovi un'immagine) */
  #info {
    position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:12; pointer-events:auto;
    background:rgba(14,20,18,.9); color:#fff; border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:16px 18px; max-height:42vh; overflow-y:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    opacity:0; transform:translateY(16px); transition:opacity .25s, transform .25s;
  }
  #info.show { opacity:1; transform:translateY(0); }
  #infoTitle { font-weight:700; font-size:1.05rem; color:#ffd7a8; margin-bottom:6px; line-height:1.25; }
  #infoText { font-size:.92rem; line-height:1.5; white-space:pre-wrap; }

  #status {
    position:fixed; left:0; right:0; bottom:0; z-index:11;
    padding:14px 20px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, rgba(0,0,0,.6));
    color:#fff; font-size:.9rem; text-align:center; pointer-events:none;
    transition:opacity .2s;
  }
  #startBtn {
    position:fixed; inset:0; margin:auto; width:230px; height:56px;
    border-radius:999px; border:none; background:#c96a3c; color:#fff;
    font-size:1.05rem; font-weight:600; pointer-events:auto; cursor:pointer; z-index:100;
  }
  #startBtn:disabled { background:#9aa8a2; }
  #errBox {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.85); color:#fff; padding:30px; text-align:center;
    font-size:.95rem; line-height:1.5; pointer-events:auto; z-index:200;
  }
  .a-enter-vr, .a-enter-ar { display:none !important; }
</style>
</head>
<body>

<div id="brand">POLI <span>INVENT</span></div>
<div id="info"><div id="infoTitle"></div><div id="infoText"></div></div>
<div id="status">Tocca per avviare la fotocamera</div>
<button id="startBtn" disabled>Caricamento…</button>
<div id="errBox"></div>

<script>
const DEFAULT_CFG = {
  mind: "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind",
  targets: [{ target:0, name:"Demo", desc:"Apri manifest.json per collegare le tue opere.",
    model:"https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf",
    scale:1, position:[0,0,0], rotation:[0,0,0], amb:1, dir:0.8 }]
};

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const errBox   = document.getElementById('errBox');
const infoEl   = document.getElementById('info');
const infoTitle= document.getElementById('infoTitle');
const infoText = document.getElementById('infoText');
function showErr(msg){ errBox.style.display='flex'; errBox.textContent=msg; }

function showInfo(name, desc){
  infoTitle.textContent = name || '';
  infoText.textContent  = desc || '';
  infoEl.classList.toggle('show', !!(name || desc));
}
function hideInfo(){ infoEl.classList.remove('show'); }

// normalizza il modello alla dimensione del marker (spazio locale)
AFRAME.registerComponent('fit-marker', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const obj = this.el.getObject3D('mesh');
      if (!obj) return;
      const box = new THREE.Box3(); const m = new THREE.Matrix4();
      obj.traverse(node => {
        if (!node.isMesh || !node.geometry) return;
        node.geometry.computeBoundingBox(); m.identity();
        let cur = node; while (cur && cur !== obj) { cur.updateMatrix(); m.premultiply(cur.matrix); cur = cur.parent; }
        box.union(node.geometry.boundingBox.clone().applyMatrix4(m));
      });
      if (box.isEmpty()) return;
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      if (!Number.isFinite(sphere.radius) || sphere.radius <= 0) return;
      const s = 0.5 / sphere.radius; obj.scale.setScalar(s);
      const center = box.getCenter(new THREE.Vector3()).multiplyScalar(s); obj.position.sub(center);
    });
  }
});

async function loadConfig() {
  try {
    const res = await fetch('manifest.json', { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  } catch (e) { console.warn('manifest.json non trovato, uso demo:', e.message); return DEFAULT_CFG; }
}

function buildScene(cfg) {
  const scene = document.createElement('a-scene');
  scene.setAttribute('mindar-image',
    `imageTargetSrc: ${cfg.mind}; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; ` +
    `maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.005`);
  scene.setAttribute('color-space', 'sRGB');
  scene.setAttribute('renderer', 'colorManagement: true');
  scene.setAttribute('vr-mode-ui', 'enabled: false');
  scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

  const cam = document.createElement('a-camera');
  cam.setAttribute('position', '0 0 0'); cam.setAttribute('look-controls', 'enabled: false');
  scene.appendChild(cam);

  const amb = document.createElement('a-light');
  amb.setAttribute('type','ambient'); amb.setAttribute('color','#ffffff'); amb.setAttribute('intensity','1.0');
  scene.appendChild(amb);
  const dir = document.createElement('a-light');
  dir.setAttribute('type','directional'); dir.setAttribute('color','#ffffff');
  dir.setAttribute('intensity','0.8'); dir.setAttribute('position','1 1 2');
  scene.appendChild(dir);

  (cfg.targets || []).forEach(t => {
    const anchor = document.createElement('a-entity');
    anchor.setAttribute('mindar-image-target', `targetIndex: ${t.target}`);

    // il modello viene creato SENZA sorgente: si carica solo alla prima inquadratura
    // (così con tanti modelli pesanti non si scarica tutto insieme all'avvio)
    const model = document.createElement('a-entity');
    model.setAttribute('fit-marker', '');
    const p = t.position || [0,0,0], r = t.rotation || [0,0,0];
    const sc = (t.scale !== undefined) ? t.scale : 1;
    model.setAttribute('position', `${p[0]} ${p[1]} ${p[2]}`);
    model.setAttribute('rotation', `${r[0]} ${r[1]} ${r[2]}`);
    model.setAttribute('scale', `${sc} ${sc} ${sc}`);
    anchor.appendChild(model);

    let loaded = false;
    anchor.addEventListener('targetFound', () => {
      if (!loaded) { loaded = true; model.setAttribute('gltf-model', t.model); }  // caricamento lazy
      amb.setAttribute('intensity', (t.amb !== undefined) ? t.amb : 1.0);
      dir.setAttribute('intensity', (t.dir !== undefined) ? t.dir : 0.8);
      showInfo(t.name, t.desc);
      statusEl.style.opacity = '0';
    });
    anchor.addEventListener('targetLost', () => {
      hideInfo();
      statusEl.style.opacity = '1';
      statusEl.textContent = 'Inquadra un’immagine';
    });
    scene.appendChild(anchor);
  });

  document.body.appendChild(scene);
  return scene;
}

(async function init() {
  const cfg = await loadConfig();
  const scene = buildScene(cfg);
  const onReady = () => { startBtn.disabled = false; startBtn.textContent = 'Avvia fotocamera'; };
  if (scene.hasLoaded) onReady(); else scene.addEventListener('loaded', onReady);
  startBtn.addEventListener('click', async () => {
    const sys = scene.systems['mindar-image-system'];
    if (!sys) { showErr('Sistema AR non pronto, ricarica la pagina.'); return; }
    try {
      startBtn.style.display = 'none';
      statusEl.textContent = 'Inquadra un’immagine';
      await sys.start();
    } catch (err) {
      showErr('Impossibile accedere alla fotocamera: ' + err.message +
        '. Apri questa pagina in HTTPS e concedi il permesso alla fotocamera.');
    }
  });
})();
</script>

</body>
</html>
